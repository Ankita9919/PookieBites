<!DOCTYPE html>
<html>
<head>
    <title>Edit Food</title>
</head>
<body>

<h1>Edit Food</h1>

<form method="POST">

    <input type="text"
           name="name"
           value="{{ food.name }}"
           required>

    <br><br>

    <input type="number"
           name="price"
           value="{{ food.price }}"
           required>

    <br><br>

    <input type="text"
           name="category"
           value="{{ food.category }}"
           required>

    <br><br>

    <button type="submit">Save Changes</button>

</form>

<br>

<a href="/owner/dashboard">Back to Dashboard</a>

</body>
</html>
