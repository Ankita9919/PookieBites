<!DOCTYPE html>
<html>
<head>
    <title>Add Food</title>
</head>
<body>

<h1>Add Food Item</h1>

<form method="POST">

    <input type="text"
           name="name"
           placeholder="Food Name"
           required>

    <br><br>

    <input type="number"
           name="price"
           placeholder="Price"
           required>

    <br><br>

    <input type="text"
           name="category"
           placeholder="Category"
           required>

    <br><br>

    <button type="submit">Add Food</button>

</form>

<br>

<a href="/owner/dashboard">Back to Dashboard</a>

</body>
</html>
